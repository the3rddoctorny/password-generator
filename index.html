<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Password Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #000;
    --muted: #666;
    --accent: #005fcc;
    --secondary: #e5e5ea;
}

@media (prefers-color-scheme: dark) {
    :root {
        --bg: #1c1c1e;
        --card: #2c2c2e;
        --text: #fff;
        --muted: #aaa;
    }
}

body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 2rem;
}

main {
    max-width: 420px;
    margin: auto;
    background: var(--card);
    padding: 1.5rem;
    border-radius: 12px;
}

label {
    display: block;
    margin-top: 1rem;
}

select, button {
    width: 100%;
    margin-top: 0.5rem;
    padding: 0.6rem;
    font-size: 1rem;
}

button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

button.secondary {
    background: var(--secondary);
    color: var(--text);
}

.password {
    margin-top: 1rem;
    font-size: 1.2rem;
    word-break: break-all;
}

.entropy {
    margin-top: 0.5rem;
    font-size: 0.85rem;
    color: var(--muted);
}

#hint {
    margin-top: 0.5rem;
    color: green;
}

.version {
    margin-top: 1rem;
    font-size: 0.75rem;
    color: var(--muted);
    text-align: center;
}
</style>
</head>

<body>
<main>
    <h1>Password Generator</h1>

    <label for="length">Password length</label>
    <select id="length">
        <option value="8">8 characters</option>
        <option value="12" selected>12 characters</option>
        <option value="15">15 characters</option>
    </select>

    <button id="generate" onclick="generate()">Generate</button>

    <div class="password" id="password" aria-live="polite"></div>

    <button id="copy" class="secondary" onclick="copyPassword()">Copy</button>
    <div id="hint" aria-live="polite"></div>

    <div class="entropy" id="entropy"></div>
    <div class="version">v1.4</div>
</main>

<script>
const AMBIGUOUS = /[Il1O0]/;
const NUMBERS = "23456789".split("");
const SYMBOLS = "!@#$%^&*?".split("");

let WORDS = [];
window.__wordsLoaded = false;
window.__wordsLoadError = false;

fetch("words_v1.json")
    .then(r => r.json())
    .then(data => {
        WORDS = data.words.filter(w => !AMBIGUOUS.test(w));
        window.__wordsLoaded = true;
    })
    .catch(() => {
        window.__wordsLoadError = true;
    });

function pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

function capitalize(w) {
    return w[0].toUpperCase() + w.slice(1);
}

function pickWord() {
    return pick(WORDS);
}

function generate() {
    if (!window.__wordsLoaded) return;

    const length = parseInt(document.getElementById("length").value, 10);

    let w1 = pickWord();
    let w2 = pickWord();

    if (Math.random() < 0.5) {
        w1 = capitalize(w1);
    } else {
        w2 = capitalize(w2);
    }

    const num = pick(NUMBERS);
    const sym = pick(SYMBOLS);

    let password = w1 + w2 + num + sym;

    // Enforce exact length
    if (password.length > length) {
        password = password.slice(0, length);
    } else {
        while (password.length < length) {
            password += pick(NUMBERS);
        }
    }

    document.getElementById("password").textContent = password;
    document.getElementById("hint").textContent = "";
    document.getElementById("entropy").textContent =
        `Length: ${password.length} • Classes: upper, lower, number, symbol`;
}

function copyPassword() {
    const pwd = document.getElementById("password").textContent;
    if (!pwd) return;

    navigator.clipboard.writeText(pwd).then(() => {
        const hint = document.getElementById("hint");
        hint.textContent = "Copied!";
        setTimeout(() => hint.textContent = "", 1200);
    });
}
</script>
</body>
</html>
