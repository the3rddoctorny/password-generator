<!DOCTYPE html>
<!-- Password Generator v1.6.0 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Password Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --bg: #f2f2f7;
  --card: #ffffff;
  --text: #000;
  --muted: #666;
  --accent: #005fcc;
  --secondary: #e5e5ea;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1c1e;
    --card: #2c2c2e;
    --text: #fff;
    --muted: #aaa;
    --accent: #0a84ff;
    --secondary: #3a3a3c;
  }
}

body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.card {
  background: var(--card);
  padding: 24px 28px;
  border-radius: 14px;
  width: 340px;
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
  text-align: center;
}

h1 {
  font-size: 1.3em;
  margin-bottom: 18px;
}

select, button, label {
  font-size: 1em;
  width: 100%;
  margin-top: 10px;
}

select, button {
  padding: 10px;
  border-radius: 10px;
  border: none;
}

button {
  background: var(--accent);
  color: white;
  cursor: pointer;
}

button.secondary {
  background: var(--secondary);
  color: var(--text);
}

.password {
  margin-top: 18px;
  padding: 14px;
  background: var(--secondary);
  border-radius: 10px;
  font-family: monospace;
  font-size: 1.1em;
  user-select: all;
  word-break: break-word;
  min-height: 1.2em;
}

.hint {
  font-size: .8em;
  color: var(--muted);
  margin-top: 6px;
  min-height: 1em;
}

.version {
  font-size: .7em;
  color: var(--muted);
  margin-top: 8px;
  text-align: right;
}

.hidden {
  display: none;
}
</style>
</head>

<body>
<main>
  <div class="card">
    <h1>Password Generator</h1>

    <label for="mode" id="modeLabel">Mode</label>
    <select id="mode">
      <option value="length" selected>Exact length</option>
      <option value="words">Word count</option>
    </select>

    <label for="length" id="lengthLabel">Password length</label>
    <select id="length">
      <option value="8">8 characters</option>
      <option value="12" selected>12 characters</option>
      <option value="15">15 characters</option>
    </select>

    <label for="wordCount" id="wordCountLabel" class="hidden">Word count</label>
    <select id="wordCount" class="hidden">
      <option value="2" selected>2 words</option>
      <option value="3">3 words</option>
      <option value="4">4 words</option>
    </select>

    <button id="generate" type="button">Generate</button>

    <div class="password" id="password" aria-live="polite"></div>

    <button id="copy" class="secondary" type="button">Copy</button>
    <div class="hint" id="hint" aria-live="polite"></div>

    <div class="version" id="version">v1.6.0 • loading words...</div>
  </div>
</main>

<script>
/* Selenium-visible state (harmless outside tests) */
window.__wordsLoaded = false;
window.__wordsLoadError = "";
window.__wordsLoadStarted = false;

// Clipboard test hooks (used by headless tests)
window.__testClipboard = window.__testClipboard || null;
window.__lastCopyOk = false;

let WORDS = [];

const $ = (id) => document.getElementById(id);
const passwordEl = $("password");
const hintEl = $("hint");
const versionEl = $("version");

const modeEl = $("mode");
const lengthEl = $("length");
const wordCountEl = $("wordCount");
const lengthLabelEl = $("lengthLabel");
const wordCountLabelEl = $("wordCountLabel");

function randIndex(max) {
  if (crypto && crypto.getRandomValues) {
    const a = new Uint32Array(1);
    crypto.getRandomValues(a);
    return a[0] % max;
  }
  return Math.floor(Math.random() * max);
}

function pickWord() {
  return WORDS[randIndex(WORDS.length)];
}

function setModeUI() {
  const isWords = modeEl.value === "words";

  lengthLabelEl.classList.toggle("hidden", isWords);
  lengthEl.classList.toggle("hidden", isWords);

  wordCountLabelEl.classList.toggle("hidden", !isWords);
  wordCountEl.classList.toggle("hidden", !isWords);
}

async function loadWords() {
  try {
    const res = await fetch("./assets/words_v1.json", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const data = await res.json();
    if (!Array.isArray(data) || data.length < 1024) {
      throw new Error("Invalid word list");
    }

    WORDS = data;
    window.__wordsLoaded = true;
    window.__wordsLoadError = "";
    versionEl.textContent = `v1.6.0 • wordlist: assets (${WORDS.length})`;
  } catch (e) {
    window.__wordsLoaded = false;
    window.__wordsLoadError = String(e);
    hintEl.textContent = "Word list failed to load";
    versionEl.textContent = "v1.6.0 • wordlist: failed";
  }
}

function generateLengthMode(length, num, sym) {
  let w1 = pickWord();
  let w2 = pickWord();

  // Capitalize exactly one word
  if (randIndex(2) === 0) {
    w1 = w1[0].toUpperCase() + w1.slice(1);
  } else {
    w2 = w2[0].toUpperCase() + w2.slice(1);
  }

  let base = w1 + w2;

  if (length === 8) {
    return w1.slice(0, 3) + w2.slice(0, 3) + num + sym;
  }

  while (base.length < length - 2) {
    base += pickWord();
  }

  const mid = Math.floor(base.length / 2);
  return (base.slice(0, mid) + num + sym + base.slice(mid)).slice(0, length);
}

function generateWordMode(wordCount, num, sym) {
  const words = [];
  for (let i = 0; i < wordCount; i++) {
    words.push(pickWord());
  }

  // Capitalize one whole word so we always have an uppercase letter
  const capIndex = randIndex(words.length);
  words[capIndex] = words[capIndex][0].toUpperCase() + words[capIndex].slice(1);

  // Keep it readable: words stay intact; number+symbol go at the end
  return words.join("") + num + sym;
}

function generate() {
  hintEl.textContent = "";

  if (!window.__wordsLoaded) {
    passwordEl.textContent = "";
    return;
  }

  const num = "123456789"[randIndex(9)];
  const sym = "*+-=?!@$"[randIndex(8)];

  const mode = modeEl.value;
  if (mode === "words") {
    const wc = parseInt(wordCountEl.value, 10);
    passwordEl.textContent = generateWordMode(wc, num, sym);
    return;
  }

  const length = parseInt(lengthEl.value, 10);
  passwordEl.textContent = generateLengthMode(length, num, sym);
}

async function copyPassword() {
  const pwd = passwordEl.textContent;
  if (!pwd) return;

  window.__lastCopyOk = false;

  // Prefer test shim when present (stable in headless)
  if (window.__testClipboard && typeof window.__testClipboard.writeText === "function") {
    await window.__testClipboard.writeText(pwd);
    window.__lastCopyOk = true;
  } else if (navigator.clipboard && navigator.clipboard.writeText) {
    await navigator.clipboard.writeText(pwd);
    window.__lastCopyOk = true;
  }

  hintEl.textContent = "Copied!";
  setTimeout(() => (hintEl.textContent = ""), 1200);
}

$("generate").addEventListener("click", generate);
$("copy").addEventListener("click", copyPassword);

modeEl.addEventListener("change", () => {
  setModeUI();
  generate();
});

wordCountEl.addEventListener("change", () => {
  if (modeEl.value === "words") generate();
});

lengthEl.addEventListener("change", () => {
  if (modeEl.value === "length") generate();
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Enter") generate();
});

window.addEventListener("load", async () => {
  setModeUI();

  window.__wordsLoadStarted = true;
  await loadWords();
  if (window.__wordsLoaded) generate();
});
</script>
</body>
</html>
