<!DOCTYPE html>
<!-- Password Generator v1.4.2 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Password Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --bg: #f2f2f7;
  --card: #ffffff;
  --text: #000;
  --muted: #666;
  --accent: #005fcc;
  --secondary: #e5e5ea;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1c1e;
    --card: #2c2c2e;
    --text: #fff;
    --muted: #aaa;
    --accent: #0a84ff;
    --secondary: #3a3a3c;
  }
}

body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.card {
  background: var(--card);
  padding: 24px 28px;
  border-radius: 14px;
  width: 340px;
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
  text-align: center;
}

h1 {
  font-size: 1.3em;
  margin-bottom: 18px;
}

select, button, label {
  font-size: 1em;
  width: 100%;
  margin-top: 10px;
}

select, button {
  padding: 10px;
  border-radius: 10px;
  border: none;
}

button {
  background: var(--accent);
  color: white;
  cursor: pointer;
}

button.secondary {
  background: var(--secondary);
  color: var(--text);
}

.password {
  margin-top: 18px;
  padding: 14px;
  background: var(--secondary);
  border-radius: 10px;
  font-family: monospace;
  font-size: 1.1em;
  user-select: all;
  word-break: break-word;
  min-height: 1.2em;
}

.hint {
  font-size: .8em;
  color: var(--muted);
  margin-top: 6px;
  min-height: 1em;
}

.version {
  font-size: .7em;
  color: var(--muted);
  margin-top: 8px;
  text-align: right;
}
</style>
</head>

<body>
<main>
  <div class="card">
    <h1>Password Generator</h1>

    <label for="length">Password length</label>
    <select id="length">
      <option value="8">8 characters</option>
      <option value="12" selected>12 characters</option>
      <option value="15">15 characters</option>
    </select>

    <button id="generate" type="button">Generate</button>

    <div class="password" id="password" aria-live="polite"></div>

    <button id="copy" class="secondary" type="button">Copy</button>
    <div class="hint" id="hint" aria-live="polite"></div>

    <div class="version">v1.4.2 • wordlist v1 (1024)</div>
  </div>
</main>

<script>
/* Selenium-visible state */
window.__wordsLoaded = false;
window.__wordsLoadError = "";
window.__wordsLoadStarted = false;

let WORDS = [];

const $ = (id) => document.getElementById(id);
const passwordEl = $("password");
const hintEl = $("hint");
const lengthEl = $("length");

function randIndex(max) {
  if (crypto?.getRandomValues) {
    const a = new Uint32Array(1);
    crypto.getRandomValues(a);
    return a[0] % max;
  }
  return Math.floor(Math.random() * max);
}

function pickWord() {
  return WORDS[randIndex(WORDS.length)];
}

async function loadWords() {
  try {
    const res = await fetch("./assets/words_v1.json", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (!Array.isArray(data) || data.length < 1024) {
      throw new Error("Invalid word list");
    }
    WORDS = data;
    window.__wordsLoaded = true;
    window.__wordsLoadError = "";
  } catch (e) {
    window.__wordsLoaded = false;
    window.__wordsLoadError = String(e);
    hintEl.textContent = "Word list failed to load";
  }
}

function generate() {
  hintEl.textContent = "";

  if (!window.__wordsLoaded) {
    passwordEl.textContent = "";
    return;
  }

  let w1 = pickWord();
  let w2 = pickWord();

  // Capitalize exactly one word
  (randIndex(2) === 0)
    ? w1 = w1[0].toUpperCase() + w1.slice(1)
    : w2 = w2[0].toUpperCase() + w2.slice(1);

  const num = "123456789"[randIndex(9)];
  const sym = "*+-=?!@$"[randIndex(8)];
  const length = parseInt(lengthEl.value, 10);

  let base = w1 + w2;

  if (length === 8) {
    passwordEl.textContent =
      w1.slice(0,3) + w2.slice(0,3) + num + sym;
    return;
  }

  while (base.length < length - 2) {
    base += pickWord();
  }

  const mid = Math.floor(base.length / 2);
  passwordEl.textContent =
    (base.slice(0, mid) + num + sym + base.slice(mid)).slice(0, length);
}

async function copyPassword() {
  const pwd = passwordEl.textContent;
  if (!pwd) return;
  await navigator.clipboard.writeText(pwd);
  hintEl.textContent = "Copied!";
  setTimeout(() => hintEl.textContent = "", 1200);
}

$("generate").addEventListener("click", generate);
$("copy").addEventListener("click", copyPassword);
lengthEl.addEventListener("change", generate);

window.addEventListener("load", async () => {
  window.__wordsLoadStarted = true;
  await loadWords();
  if (window.__wordsLoaded) generate();
});
</script>
</body>
</html>
