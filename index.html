<!DOCTYPE html>
<!-- Password Generator v1.8.0 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Password Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --bg: #f2f2f7;
  --card: #ffffff;
  --text: #000;
  --muted: #666;
  --accent: #005fcc;
  --secondary: #e5e5ea;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1c1e;
    --card: #2c2c2e;
    --text: #fff;
    --muted: #aaa;
    --accent: #0a84ff;
    --secondary: #3a3a3c;
  }
}

body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.card {
  background: var(--card);
  padding: 24px 28px;
  border-radius: 14px;
  width: 360px;
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
  text-align: center;
}

h1 {
  font-size: 1.3em;
  margin-bottom: 18px;
}

select, button, label {
  font-size: 1em;
  width: 100%;
  margin-top: 10px;
}

select, button {
  padding: 10px;
  border-radius: 10px;
  border: none;
}

button {
  background: var(--accent);
  color: white;
  cursor: pointer;
}

button.secondary {
  background: var(--secondary);
  color: var(--text);
}

.password {
  margin-top: 18px;
  padding: 14px;
  background: var(--secondary);
  border-radius: 10px;
  font-family: monospace;
  font-size: 1.1em;
  user-select: all;
  word-break: break-word;
  min-height: 1.2em;
  cursor: pointer;
}

.password:focus {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.strength {
  font-size: .85em;
  color: var(--muted);
  margin-top: 8px;
  min-height: 1em;
  text-align: left;
}

.toggleRow {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
  text-align: left;
}

.toggleRow input {
  width: auto;
  margin: 0;
}

.hint {
  font-size: .8em;
  color: var(--muted);
  margin-top: 6px;
  min-height: 1em;
}

.version {
  font-size: .7em;
  color: var(--muted);
  margin-top: 8px;
  text-align: right;
}

.hidden {
  display: none;
}
</style>
</head>

<body>
<main>
  <div class="card">
    <h1>Password Generator</h1>

    <label for="mode" id="modeLabel">Mode</label>
    <select id="mode">
      <option value="length" selected>Exact length</option>
      <option value="words">Word count</option>
    </select>

    <label for="length" id="lengthLabel">Password length</label>
    <select id="length">
      <option value="8">8 characters</option>
      <option value="12" selected>12 characters</option>
      <option value="15">15 characters</option>
    </select>

    <label for="wordCount" id="wordCountLabel" class="hidden">Word count</label>
    <select id="wordCount" class="hidden">
      <option value="2" selected>2 words</option>
      <option value="3">3 words</option>
      <option value="4">4 words</option>
    </select>

    <label class="toggleRow" for="includeDigit">
      <input type="checkbox" id="includeDigit" checked>
      Include digit
    </label>

    <label class="toggleRow" for="includeSymbol">
      <input type="checkbox" id="includeSymbol" checked>
      Include symbol
    </label>

<div id="symbolControls" style="margin-top:8px; margin-left:26px;">
  <label style="display:block; font-size:.9em; color:var(--muted); margin-bottom:6px;">
    Symbol set
  </label>
  <select id="symbolSet" style="width:100%; padding:10px; border-radius:10px; border:none;">
    <option value="basic" selected>Basic (!@$?*)</option>
    <option value="extended">Extended (!@$?*+-=)</option>
    <option value="custom">Custom</option>
  </select>

  <input
    id="customSymbols"
    type="text"
    placeholder="Enter allowed symbols, e.g. !@#$"
    style="width:100%; margin-top:8px; padding:10px; border-radius:10px; border:none; display:none;"
    autocomplete="off"
    spellcheck="false"
  />
</div>

<div class="toggles hidden" id="wordStyleControls" style="text-align:left; margin-top:12px;">
  <label class="toggleRow" for="titleCase">
    <input type="checkbox" id="titleCase" checked>
    Title Case (RocketSilver)
  </label>

  <label style="display:block; margin-top:10px; font-size:.9em; color:var(--muted);">
    Separator (Word Count mode)
  </label>
  <select id="separator" style="width:100%; padding:10px; border-radius:10px; border:none;">
    <option value="" selected>None</option>
    <option value="-">Hyphen (-)</option>
    <option value="_">Underscore (_)</option>
    <option value=".">Dot (.)</option>
  </select>
</div>

    <button id="generate" type="button">Generate</button>

    <div class="password" id="password" aria-live="polite" role="button" tabindex="0"></div>
    <div class="strength" id="strength" aria-live="polite"></div>

    <button id="copy" class="secondary" type="button">Copy</button>
    <div class="hint" id="hint" aria-live="polite"></div>

    <div class="version" id="version">v1.8.0 • loading words...</div>
  </div>
</main>

<!-- Prefer script-loaded words (works for file:// and avoids fetch flake) -->
<script src="./assets/words_v1.js"></script>

<script>
/* Selenium-visible state (harmless outside tests) */
window.__wordsLoaded = false;
window.__wordsLoadError = "";
window.__wordsLoadStarted = false;

// Clipboard test hooks (used by headless tests)
window.__testClipboard = window.__testClipboard || null;
window.__lastCopyOk = false;

const SYMBOLS_BASIC = "!@$?*";
const SYMBOLS_EXTENDED = "!@$?*+-=";

const FALLBACK_WORDS = ['alpha', 'bravo', 'charlie', 'delta', 'echo', 'foxtrot', 'golf', 'hotel', 'india', 'juliet', 'kilo', 'lima', 'mango', 'nectar', 'olive', 'pasta', 'quartz', 'rocket', 'silver', 'tango', 'umbra', 'vivid', 'whiskey', 'xenon', 'yankee', 'zebra', 'apricot', 'basil', 'canyon', 'dragon', 'ember', 'frost', 'galaxy', 'harbor', 'icicle', 'jungle', 'karma', 'lantern', 'meteor', 'noodle', 'orbit', 'pocket', 'quiet', 'raven', 'saffron', 'thunder', 'utopia', 'velvet', 'wander', 'yellow', 'zenith', 'butter', 'cobalt', 'cookie', 'dynamo', 'fabric', 'gadget', 'hazelnut', 'island', 'jacket', 'kitten', 'lemon', 'marble', 'napkin', 'ocean', 'pepper', 'picnic', 'quantum', 'ripple', 'sunset', 'teapot', 'unicorn', 'violet', 'walnut', 'winter'];

let WORDS = [];

const $ = (id) => document.getElementById(id);
const passwordEl = $("password");
const strengthEl = $("strength");
const hintEl = $("hint");
const versionEl = $("version");

const modeEl = $("mode");
const lengthEl = $("length");
const wordCountEl = $("wordCount");
const lengthLabelEl = $("lengthLabel");
const wordCountLabelEl = $("wordCountLabel");
const includeDigitEl = $("includeDigit");
const includeSymbolEl = $("includeSymbol");
const symbolSetEl = $("symbolSet");
const customSymbolsEl = $("customSymbols");
const symbolControlsEl = $("symbolControls");
const titleCaseEl = $("titleCase");
const separatorEl = $("separator");
const wordStyleControlsEl = $("wordStyleControls");


function randIndex(max) {
  if (crypto && crypto.getRandomValues) {
    const a = new Uint32Array(1);
    crypto.getRandomValues(a);
    return a[0] % max;
  }
  return Math.floor(Math.random() * max);
}

function sanitizeWord(w) {
  if (typeof w !== "string") return "";
  return w.trim().toLowerCase().replace(/[^a-z]/g, "");
}

function pickWord() {
  return WORDS[randIndex(WORDS.length)];
}

function pickDigit() {
  return "123456789"[randIndex(9)];
}

function currentSymbolSet() {
  const mode = symbolSetEl?.value || "basic";
  if (mode === "extended") return SYMBOLS_EXTENDED;
  if (mode === "custom") {
    const s = (customSymbolsEl.value || "").trim();
    // Keep only non-alphanumeric characters, dedupe
    const cleaned = Array.from(new Set(s.split("").filter(ch => !/[A-Za-z0-9\s]/.test(ch)))).join("");
    return cleaned || SYMBOLS_BASIC; // fallback so we never end up with empty set
  }
  return SYMBOLS_BASIC;
}

function refreshSymbolUI() {
  const enabled = includeSymbolEl.checked;
  symbolSetEl.disabled = !enabled;
  symbolControlsEl.style.opacity = enabled ? "1" : "0.5";

  const isCustom = enabled && symbolSetEl.value === "custom";
  customSymbolsEl.style.display = isCustom ? "block" : "none";
}

function pickSymbol() {
  const set = currentSymbolSet();
  return set[randIndex(set.length)];
}

function setModeUI() {
  const isWords = modeEl.value === "words";

  lengthLabelEl.classList.toggle("hidden", isWords);
  lengthEl.classList.toggle("hidden", isWords);

  wordCountLabelEl.classList.toggle("hidden", !isWords);
  wordCountEl.classList.toggle("hidden", !isWords);

  // Word styling options apply only to Word Count mode
  if (wordStyleControlsEl) {
    wordStyleControlsEl.classList.toggle("hidden", !isWords);
  }
}

async function loadWords() {
  try {
    // Script-loaded words (fast path)
    if (Array.isArray(window.WORDS_V1) && window.WORDS_V1.length >= 1024) {
      WORDS = window.WORDS_V1.map(sanitizeWord).filter(Boolean);
      window.__wordsLoaded = true;
      window.__wordsLoadError = "";
      versionEl.textContent = `v1.8.0 • wordlist: assets-js (${WORDS.length})`;
      return;
    }

    // Fetch JSON wordlist (http://localhost / GitHub Pages)
    const res = await fetch("./assets/words_v1.json", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (!Array.isArray(data) || data.length < 1024) throw new Error("Invalid word list");

    WORDS = data.map(sanitizeWord).filter(Boolean);
    window.__wordsLoaded = true;
    window.__wordsLoadError = "";
    versionEl.textContent = `v1.8.0 • wordlist: assets-json (${WORDS.length})`;
  } catch (e) {
    WORDS = FALLBACK_WORDS.map(sanitizeWord).filter(Boolean);
    window.__wordsLoaded = true;
    window.__wordsLoadError = String(e);
    versionEl.textContent = `v1.8.0 • wordlist: fallback (${WORDS.length})`;
    hintEl.textContent = "Word list failed to load (using fallback)";
  }
}

function ensureUppercase(s) {
  if (/[A-Z]/.test(s)) return s;
  // Force one uppercase in the first letter-ish position
  return s.length ? (s[0].toUpperCase() + s.slice(1)) : s;
}

function generateLengthMode(length, suffix) {
  let w1 = pickWord();
  let w2 = pickWord();

  // Capitalize exactly one word so we always have an uppercase letter
  if (randIndex(2) === 0) {
    w1 = w1[0].toUpperCase() + w1.slice(1);
  } else {
    w2 = w2[0].toUpperCase() + w2.slice(1);
  }

  let base = w1 + w2;
  const target = Math.max(length - suffix.length, 0);

  while (base.length < target) {
    base += pickWord();
  }

  const mid = Math.floor(base.length / 2);
  const out = (base.slice(0, mid) + suffix + base.slice(mid)).slice(0, length);
  return ensureUppercase(out);
}

function generateWordMode(wordCount, suffix, suffixParts) {
  const words = [];
  for (let i = 0; i < wordCount; i++) {
    words.push(applyCase(pickWord()));
  }

  const sep = (separatorEl && separatorEl.value) ? separatorEl.value : "";

  if (sep) {
    // Treat digit/symbol as their own parts for readability
    const allParts = words.concat(suffixParts || []);
    return ensureUppercase(allParts.filter(Boolean).join(sep));
  }

  // No separator: append digit/symbol directly at the end
  return ensureUppercase(words.join("") + (suffix || ""));
}

function applyCase(word) {
  const w = sanitizeWord(word);
  if (!w) return "";
  if (!titleCaseEl.checked) return w.toLowerCase();
  return w[0].toUpperCase() + w.slice(1).toLowerCase();
}

function joinWords(words) {
  const sep = separatorEl.value || "";
  return words.join(sep);
}

function strengthRating(pwd) {
  if (!pwd) return "";

  const len = pwd.length;
  const hasUpper = /[A-Z]/.test(pwd);
  const hasLower = /[a-z]/.test(pwd);
  const hasDigit = /[0-9]/.test(pwd);
  const hasSymbol = /[*+\-=?!@$]/.test(pwd);
  const types = [hasUpper, hasLower, hasDigit, hasSymbol].filter(Boolean).length;

  let rating = "Weak";
  if (len >= 12 && types >= 3) rating = "Good";
  if (len >= 15 && types === 4) rating = "Strong";

  const isWords = modeEl.value === "words";
  const modeDetail = isWords
    ? `${parseInt(wordCountEl.value, 10)} words`
    : `${parseInt(lengthEl.value, 10)} chars target`;

  const policy = [
    includeDigitEl.checked ? "digit" : "no digit",
    includeSymbolEl.checked ? "symbol" : "no symbol",
  ].join(", ");

  const style = isWords
    ? ` • ${titleCaseEl.checked ? "Title Case" : "lowercase"} • sep:${(separatorEl.value || "none")}`
    : "";

  return `Strength: ${rating} • ${len} chars • ${modeDetail} • ${types}/4 types • ${policy}${style}`;
}

function updateStrength() {
  strengthEl.textContent = strengthRating(passwordEl.textContent);
}

function generate() {
  hintEl.textContent = "";

  if (!window.__wordsLoaded) {
    passwordEl.textContent = "";
    strengthEl.textContent = "";
    return;
  }

  const digit = includeDigitEl.checked ? pickDigit() : "";
  const sym = includeSymbolEl.checked ? pickSymbol() : "";
  const suffix = digit + sym;

  const mode = modeEl.value;
  if (mode === "words") {
    const wc = parseInt(wordCountEl.value, 10);

    // If a separator is chosen, keep digit/symbol as their own chunks for readability.
    const sep = (separatorEl && separatorEl.value) ? separatorEl.value : "";
    const suffixParts = sep ? [digit, sym].filter(Boolean) : [];

    passwordEl.textContent = generateWordMode(wc, suffix, suffixParts);
    updateStrength();
    return;
  }

  const length = parseInt(lengthEl.value, 10);
  passwordEl.textContent = generateLengthMode(length, suffix);
  updateStrength();
}

async function writeClipboard(text) {
  // Test shim (headless-friendly)
  if (window.__testClipboard?.writeText) {
    await window.__testClipboard.writeText(text);
    return;
  }

  // Real clipboard API
  if (navigator.clipboard?.writeText) {
    await navigator.clipboard.writeText(text);
    return;
  }

  // Fallback (older browsers)
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.setAttribute("readonly", "");
  ta.style.position = "absolute";
  ta.style.left = "-9999px";
  document.body.appendChild(ta);
  ta.select();
  document.execCommand("copy");
  document.body.removeChild(ta);
}

function setCopyUI(state) {
  const btn = $("copy");
  if (state === "copied") {
    btn.dataset.prev = btn.textContent;
    btn.textContent = "Copied!";
    btn.disabled = true;
  } else if (state === "reset") {
    btn.textContent = btn.dataset.prev || "Copy";
    btn.disabled = false;
  } else if (state === "failed") {
    btn.dataset.prev = btn.textContent;
    btn.textContent = "Copy failed";
    btn.disabled = false;
  }
}

async function copyPassword() {
  const pwd = passwordEl.textContent.trim();
  if (!pwd) return;

  window.__lastCopyOk = false;

  try {
    await writeClipboard(pwd);
    window.__lastCopyOk = true;

    hintEl.textContent = "Copied!";
    setCopyUI("copied");

    setTimeout(() => {
      hintEl.textContent = "";
      setCopyUI("reset");
    }, 1200);

  } catch (e) {
    window.__lastCopyOk = false;
    hintEl.textContent = "Copy failed";
    setCopyUI("failed");

    setTimeout(() => {
      hintEl.textContent = "";
      setCopyUI("reset");
    }, 1500);
  }
}

$("generate").addEventListener("click", generate);
$("copy").addEventListener("click", copyPassword);

// Click-to-copy on the password itself
passwordEl.addEventListener("click", copyPassword);
passwordEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    copyPassword();
  }
});

modeEl.addEventListener("change", () => {
  setModeUI();
  generate();
});

wordCountEl.addEventListener("change", () => {
  if (modeEl.value === "words") generate();
});

lengthEl.addEventListener("change", () => {
  if (modeEl.value === "length") generate();
});

includeDigitEl.addEventListener("change", generate);
includeSymbolEl.addEventListener("change", () => {
  refreshSymbolUI();
  generate();
});

symbolSetEl.addEventListener("change", () => {
  refreshSymbolUI();
  generate();
});

customSymbolsEl.addEventListener("input", () => {
  if (includeSymbolEl.checked && symbolSetEl.value === "custom") generate();
});

titleCaseEl.addEventListener("change", () => {
  if (modeEl.value === "words") generate();
});

separatorEl.addEventListener("change", () => {
  if (modeEl.value === "words") generate();
});

document.addEventListener("keydown", (e) => {
  const tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : "";
  if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA" || tag === "BUTTON") return;
  if (e.key === "Enter") generate();
});

window.addEventListener("load", async () => {
  setModeUI();
  window.__wordsLoadStarted = true;
  refreshSymbolUI();
  await loadWords();
  generate();
});
</script>
</body>
</html>
